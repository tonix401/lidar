};
onUi("draw", "draw", String, applyVisibility);
onUi("colorBy", "colorBy", String, () => $("legendBox").classList.toggle("hidden", ui.colorBy === "uniform"));
onUi("layerSel", "layer", Number);
onUi("range", "maxRange", Number, () => { $("rangeVal").textContent = ui.maxRange + " m"; buildGuides(Math.min(ui.maxRange, 200)); });
onUi("mount", "mount", String, () => { mountChosen = true; try { localStorage.setItem("mrs6000.mount.v2", ui.mount); } catch (e) {} buildGuides(Math.min(ui.maxRange, 200)); });
$("mount").value = ui.mount;
$("size").oninput = e => { pointMat.size = +e.target.value; needsRender = true; render2d(); };
$("rangeVal").textContent = ui.maxRange + " m";
$("pause").onclick = togglePause;
window.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); togglePause(); } });
function togglePause() { ui.paused = !ui.paused; $("pause").classList.toggle("on", ui.paused); $("pause").textContent = ui.paused ? "Resume" : "Pause"; }

// view size follows the data: 90th percentile of the visible distances (falls back to max range)
let viewDist = 0;
// side and front views keep the camera level (no pitch), so vertical edges stay vertical on screen —
// a tilted camera makes vertical walls look like they lean in perspective
function setView(kind) {
  const d = Math.max(2, Math.min(viewDist || ui.maxRange, ui.maxRange, 40));
  controls.target.set(d * 0.35, 0, 0);
  if (kind === "top") camera.position.set(d * 0.35, 0, d * 1.6);
  else if (kind === "side") camera.position.set(d * 0.35, -d * 1.4, 0);
  else if (kind === "front") { camera.position.set(-2.5, 0, 0); controls.target.set(d, 0, 0); }
  else camera.position.set(-d * 0.5, -d * 0.6, d * 0.6);
  controls.update();
  needsRender = true;
}
$("vFront").onclick = () => setView("front");
$("vPersp").onclick = () => setView("persp");
$("vTop").onclick = () => setView("top");
$("vSide").onclick = () => setView("side");

// ---------- layer calibration (per-layer distance offsets) ----------
// Learned offsets in metres, added to every raw distance of that layer before filtering.
let layerBias = new Float32Array(24), calFrame = 0;
const BIAS_KEY = "mrs6000.layerbias.v2";           // v1 values could contain the drift fixed below
try { const b = JSON.parse(localStorage.getItem(BIAS_KEY) || "null"); if (Array.isArray(b)) { layerBias = Float32Array.from(b); removeUnobservable(layerBias); } } catch (e) {}
try { localStorage.removeItem("mrs6000.layerbias.v1"); } catch (e) {}
function saveLayerBias() { try { localStorage.setItem(BIAS_KEY, JSON.stringify(Array.from(layerBias))); } catch (e) {} }

// Leave-own-layer-out plane fits on the (temporally averaged, already corrected) range image:
// for points on flat surfaces, fit a plane through the neighbouring layers only (±2 layers,
// ±6 beams) and measure along the beam how far this layer's point is from it. The median of
// that per layer is its remaining offset; we move the offset a fraction `rate` towards it.
function updateLayerBias(D) {
  const { L, B, rayX, rayY, rayZ } = G, nrm = [0, 0, 0];
  const per = Array.from({ length: L }, () => []);
  for (let l = 0; l < L; l++) for (let b = 6; b < B - 6; b += 2) {
    const i = l * B + b, d = D[i];
    if (d <= 0) continue;
    const tol = 0.15 + 0.03 * d;
    let n = 0, sx = 0, sy = 0, sz = 0, sxx = 0, sxy = 0, sxz = 0, syy = 0, syz = 0, szz = 0;
    for (let ll = Math.max(0, l - 2); ll <= Math.min(L - 1, l + 2); ll++) {
      if (ll === l) continue;
      for (let bb = b - 6; bb <= b + 6; bb++) {
        const j = ll * B + bb, v = D[j];
        if (v <= 0 || Math.abs(v - d) > tol) continue;
        const x = rayX[j] * v, y = rayY[j] * v, z = rayZ[j] * v;
        n++; sx += x; sy += y; sz += z; sxx += x * x; sxy += x * y; sxz += x * z; syy += y * y; syz += y * z; szz += z * z;
      }
    }
    if (n < 20) continue;
    const cx = sx / n, cy = sy / n, cz = sz / n;
    const v = smallestEigenvector(sxx / n - cx * cx, sxy / n - cx * cy, sxz / n - cx * cz, syy / n - cy * cy, syz / n - cy * cz, szz / n - cz * cz, nrm);
    if (v < 0 || v > 0.03) continue;                                   // only flat patches
    const nr = nrm[0] * rayX[i] + nrm[1] * rayY[i] + nrm[2] * rayZ[i];
    if (Math.abs(nr) < 0.3) continue;                                   // not too grazing
    const r = (nrm[0] * cx + nrm[1] * cy + nrm[2] * cz) / nr - d;
    if (Math.abs(r) < 0.1) per[l].push(r);
  }
  const upd = per.map(a => { if (a.length < 20) return null; a.sort((x, y) => x - y); return a[a.length >> 1]; });
  const known = upd.filter(x => x !== null);
  if (known.length < L / 2) return false;                               // not enough flat surfaces in view
  const mean = known.reduce((a, x) => a + x, 0) / known.length;
  for (let l = 0; l < L; l++) if (upd[l] !== null) layerBias[l] += cfg.layercal.rate * (upd[l] - mean);
  removeUnobservable(layerBias);
  saveLayerBias();
  drawLayerBias();
  return true;
}

// Plane fits through neighbouring layers cannot see a constant offset (it only moves everything)
// or an offset growing linearly from bottom to top (it only tilts every surface, and the
// neighbour planes tilt along with it), and barely see a slow bow (≈1 mm signal). Left free, these
// drift with every update: the linear part turned vertical walls into walls leaning 15°+ after
// ~10 min, the bow settled at ~8 cm. So the offsets are kept orthogonal to all polynomials up to
// degree 2 in the layer index — the real per-layer pattern (period ≈ 6 layers) is untouched.
function removeUnobservable(b) {
  const L = b.length, basis = [];
  for (let deg = 0; deg <= 2; deg++) {                    // Gram–Schmidt on 1, l, l²
    const v = Float64Array.from({ length: L }, (_, l) => ((l - (L - 1) / 2) / L) ** deg);
    for (const u of basis) { let d = 0; for (let l = 0; l < L; l++) d += v[l] * u[l]; for (let l = 0; l < L; l++) v[l] -= d * u[l]; }
    let n = 0; for (let l = 0; l < L; l++) n += v[l] * v[l]; n = Math.sqrt(n);
    for (let l = 0; l < L; l++) v[l] /= n;
    basis.push(v);
  }
  for (const u of basis) { let d = 0; for (let l = 0; l < L; l++) d += b[l] * u[l]; for (let l = 0; l < L; l++) b[l] -= d * u[l]; }
}

function drawLayerBias() {
  const cv = $("layerBiasChart");
  if (!cv || !cv.closest("details").open) return;
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, L = layerBias.length;
  const span = Math.max(0.02, ...Array.from(layerBias, Math.abs));
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#2a313c"; ctx.fillRect(0, H / 2, W, 1);
  for (let l = 0; l < L; l++) {
    const v = layerBias[l], h = v / span * (H / 2 - 14);
    ctx.fillStyle = v >= 0 ? "#4aa3ff" : "#d29922";
    ctx.fillRect(l * W / L + 2, h >= 0 ? H / 2 - h : H / 2, W / L - 4, Math.abs(h));
  }
  ctx.fillStyle = "#8b95a3"; ctx.font = "20px system-ui";
  ctx.fillText(`±${Math.round(span * 1000)} mm   layer 0 → ${L - 1}`, 6, 22);
}

// ---------- organized grid & GPU buffers ----------
// The scan is a range image: L layers (rows, bottom→top) × B beams (columns, right→left).
// Vertex index = layer * B + beam. Points, layer lines and the triangle mesh all share
// one position/colour/normal buffer and differ only in their index buffers.
let G = null;                               // grid state, (re)allocated when the shape changes
const pointMat = new THREE.PointsMaterial({ size: 1, sizeAttenuation: false, vertexColors: true });
const lineMat = new THREE.LineBasicMaterial({ vertexColors: true });
const meshMat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
let pointsObj, linesObj, meshObj;

function allocGrid(L, B) {
  const N = L * B;
  for (const o of [pointsObj, linesObj, meshObj]) if (o) { scene.remove(o); o.geometry.dispose(); }
  G = {
    L, B, N,
    rawIn: new Float32Array(N), raw: new Float32Array(N), rssi: new Float32Array(N), elev: new Float32Array(N),
    // per-beam history (see stage 2): estimate, samples in average, learned noise variance,
    // pending change candidate, dropout age, validity bits of the last 32 scans, jump rate
    temporal: new Float32Array(N), nAvg: new Uint16Array(N), noiseVar: new Float32Array(N),
    cand: new Float32Array(N), candCnt: new Uint8Array(N), age: new Uint8Array(N),
    validBits: new Uint32Array(N), jumpRate: new Float32Array(N), frames: 0,
    hist: new Float32Array(N), conf: new Float32Array(N),         // history-filtered ranges + confidence weights
    alt: new Float32Array(N), altN: new Uint16Array(N),           // second background mode (edges: near/far surface)
    changed: new Uint8Array(N), motionHold: new Uint8Array(N),    // adaptive: per-scan change flags, frames left "moving"
    area: new Uint8Array(N),                                       // 0 static flat · 1 static detail · 2 moving
    work: new Float32Array(N), out: new Float32Array(N),           // filter scratch buffers
    rayX: new Float32Array(N), rayY: new Float32Array(N), rayZ: new Float32Array(N),
    pos: new THREE.BufferAttribute(new Float32Array(N * 3), 3).setUsage(THREE.DynamicDrawUsage),
    col: new THREE.BufferAttribute(new Float32Array(N * 3), 3).setUsage(THREE.DynamicDrawUsage),
    nrm: new THREE.BufferAttribute(new Float32Array(N * 3), 3).setUsage(THREE.DynamicDrawUsage),
    pIdx: new Uint32Array(N), lIdx: new Uint32Array(N * 2), tIdx: new Uint32Array(N * 6),
  };
  const mk = (idx, withNormals) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", G.pos); g.setAttribute("color", G.col);
    if (withNormals) g.setAttribute("normal", G.nrm);
    g.setIndex(new THREE.BufferAttribute(idx, 1).setUsage(THREE.DynamicDrawUsage));
    g.setDrawRange(0, 0);
    return g;
  };
  pointsObj = new THREE.Points(mk(G.pIdx), pointMat);
  linesObj = new THREE.LineSegments(mk(G.lIdx), lineMat);
  meshObj = new THREE.Mesh(mk(G.tIdx, true), meshMat);
  for (const o of [meshObj, linesObj, pointsObj]) { o.frustumCulled = false; scene.add(o); }
  applyVisibility();
}

function applyVisibility() {
  needsRender = true;
  if (!G) return;
  meshObj.visible = ui.draw.startsWith("surface");
  pointsObj.visible = ui.draw.includes("points");
  linesObj.visible = ui.draw.includes("lines");
}

// distance tolerance used everywhere for "same surface": absolute part covers the 62.5 mm
// range quantisation, relative part grows with range
const sameTol = (d, abs, rel) => abs + rel * d;

// ---------- stage 1: outlier rejection (on the raw scan) ----------
// A return survives if enough azimuth neighbours in its layer lie at a similar distance:
// isolated spikes and mixed pixels go, object edges (supported on one side) stay.
function rejectOutliers(src, dst) {
  const { L, B } = G, c = cfg.outlier;
  let removed = 0;
  for (let l = 0; l < L; l++) for (let b = 0; b < B; b++) {
    const i = l * B + b, d = src[i];
    dst[i] = d;
    if (!c.on || d <= 0) continue;
    // moving bodies have real depth jumps between neighbouring beams (limbs, silhouettes):
    // there one similar neighbour within a 3× wider tolerance is enough
    const moving = isMoving(i) || (cfg.adaptive.on && G.changed[i] === 1);   // also beams that changed this scan
    const tol = sameTol(d, c.abs, c.rel) * (moving ? 3 : 1), need = moving ? 1 : c.need;
    let support = 0;
    for (let k = Math.max(0, b - c.win); k <= Math.min(B - 1, b + c.win); k++) {
      if (k !== b && src[l * B + k] > 0 && Math.abs(src[l * B + k] - d) <= tol) support++;
    }
    if (support < need) { dst[i] = 0; removed++; }
  }
  return removed;
}

// ---------- stage 2: temporal smoothing (per-beam history, Kalman-style) ----------
// Each beam keeps a running mean whose window grows while the beam stays still (up to
// `window` scans), i.e. a 1D Kalman filter for a constant distance. Every beam also learns its
// own measurement noise σ (EMA of squared innovations, never below `noiseFloor`), so the
// change gate is k·σ of *this* beam rather than one global threshold. A sample outside the
// gate does not reset the beam at once: it becomes a candidate, and only when `confirm`
// consecutive samples agree on it does the beam switch (real motion). Lone spikes are ignored.
const NOISE_BETA = 0.05, JUMP_BETA = 0.1;
function resetHistory() {
  if (!G) return;
  for (const a of [G.temporal, G.nAvg, G.noiseVar, G.cand, G.candCnt, G.age, G.validBits, G.jumpRate, G.alt, G.altN, G.changed, G.motionHold, G.area]) a.fill(0);
  G.frames = 0;
}
// ---------- adaptive: motion detection (before the temporal update) ----------
// Follows per-beam background subtraction for static LiDARs (beam-wise statistical models with a
// z-gate |r−μ|/σ ≤ k, multi-modal backgrounds) and Dynablox's conservative rules:
//  • a beam only reports change once its model is established (≥ 5 of the last scans valid),
//  • a return matching either of the beam's two background modes is NOT a change — edge beams that
//    alternate between a near and a far surface are background, not motion,
//  • changed beams are grouped into connected clusters (8-neighbourhood, similar range); clusters
//    smaller than `minCluster` beams are noise and dropped,
//  • surviving clusters seed a region grow through neighbouring beams of similar range (the rest of
//    the object), limited to `growBeams` steps and never into beams that match their own established
//    background (so it can't leak along a wall); grown beams stay "moving" for `hold` scans.
const ESTABLISHED = 5;
let motionQueue = new Int32Array(0), motionMark = new Uint8Array(0);
function beamGate(i) {
  const ct = cfg.temporal, s = Math.sqrt(G.noiseVar[i] * (1 + 1 / Math.max(1, G.nAvg[i])));
  return Math.max(ct.minGate, ct.k * s);
}
// does z match this beam's established background (either mode)? then it is static, whatever its neighbours do
function isBackground(i, z) {
  if (G.nAvg[i] < ESTABLISHED && G.altN[i] < ESTABLISHED) return false;
  const g = beamGate(i);
  return (G.nAvg[i] >= ESTABLISHED && Math.abs(z - G.temporal[i]) <= g) || (G.altN[i] >= ESTABLISHED && Math.abs(z - G.alt[i]) <= g);
}
function detectMotion(cur) {
  const a = cfg.adaptive, { L, B, N, temporal: T, alt, altN, changed, motionHold, validBits } = G;
  for (let i = 0; i < N; i++) if (motionHold[i] > 0) motionHold[i]--;
  changed.fill(0);
  if (!a.on || G.frames < ESTABLISHED) return 0;
  for (let i = 0; i < N; i++) {
    const z = cur[i];
    if (z <= 0 || popcount(validBits[i] & 0x3f) < ESTABLISHED) continue;     // model not established
    const g = beamGate(i);
    const matchT = T[i] > 0 && Math.abs(z - T[i]) <= g, matchAlt = alt[i] > 0 && altN[i] >= 3 && Math.abs(z - alt[i]) <= g;
    if (!matchT && !matchAlt) changed[i] = 1;
  }
  if (motionQueue.length !== N) { motionQueue = new Int32Array(N); motionMark = new Uint8Array(N); }
  const Q = motionQueue, mark = motionMark;
  mark.fill(0);
  const same = (p, q) => Math.abs(cur[p] - cur[q]) <= 0.15 + 0.03 * cur[p];
  let seeds = 0;
  for (let s0 = 0; s0 < N; s0++) {
    if (!changed[s0] || mark[s0]) continue;
    // 1) connected cluster of changed beams
    let head = 0, tail = 0;
    Q[tail++] = s0; mark[s0] = 1;
    while (head < tail) {
      const p = Q[head++], l = (p / B) | 0, b = p - l * B;
      for (let dl = -1; dl <= 1; dl++) for (let db = -1; db <= 1; db++) {
        const ll = l + dl, bb = b + db;
        if (ll < 0 || ll >= L || bb < 0 || bb >= B) continue;
        const q = ll * B + bb;
        if (changed[q] && !mark[q] && same(p, q)) { mark[q] = 1; Q[tail++] = q; }
      }
    }
    if (tail < a.minCluster) continue;                                          // too small: noise
    seeds++;
    // 2) grow into the rest of the object (similar range), `growBeams` rings deep
    let ringStart = 0, ringEnd = tail;
    for (let k = 0; k < tail; k++) motionHold[Q[k]] = a.hold;
    for (let depth = 0; depth < a.growBeams && ringStart < ringEnd; depth++) {
      for (let h = ringStart; h < ringEnd; h++) {
        const p = Q[h], l = (p / B) | 0, b = p - l * B;
        for (let dl = -1; dl <= 1; dl++) for (let db = -1; db <= 1; db++) {
          const ll = l + dl, bb = b + db;
          if (ll < 0 || ll >= L || bb < 0 || bb >= B) continue;
          const q = ll * B + bb;
          if (mark[q] || cur[q] <= 0 || !same(p, q) || isBackground(q, cur[q])) continue;   // never absorb static background
          mark[q] = 2; Q[tail++] = q; motionHold[q] = a.hold;
        }
      }
      ringStart = ringEnd; ringEnd = tail;
    }
  }
  return seeds;
}
const isMoving = i => cfg.adaptive.on && G.motionHold[i] > 0;

function temporalUpdate(cur) {
  const c = cfg.temporal, on = c.on, hold = on ? c.hold : 0, staticN = on ? c.window : 1;
  const dynN = Math.min(staticN, cfg.adaptive.dynWindow);
  const floor2 = c.noiseFloor * c.noiseFloor;
  const { temporal: T, nAvg, noiseVar: R, cand, candCnt, age, validBits, jumpRate, alt, altN } = G;
  for (let i = 0; i < G.N; i++) {
    const z = cur[i];
    validBits[i] = ((validBits[i] << 1) | (z > 0 ? 1 : 0)) >>> 0;
    if (z <= 0) {                                         // dropout: hold, then forget
      if (age[i] < 255) age[i]++;
      if (age[i] > hold) { T[i] = 0; nAvg[i] = 0; candCnt[i] = 0; }
      continue;
    }
    age[i] = 0;
    const moving = isMoving(i), maxN = moving ? dynN : staticN, confirm = moving ? 1 : c.confirm;
    if (moving && nAvg[i] > maxN) nAvg[i] = maxN;          // forget the long average at once
    if (T[i] <= 0 || nAvg[i] === 0) {                     // first sample of this beam
      T[i] = z; nAvg[i] = 1; R[i] = Math.max(R[i], floor2); candCnt[i] = 0;
      continue;
    }
    const gate = beamGate(i);
    // second background mode (multi-modal background): the beam came back to a surface it knew →
    // swap modes instantly, no confirmation delay and not counted as a jump
    if (on && alt[i] > 0 && altN[i] >= 2 && Math.abs(z - T[i]) > gate && Math.abs(z - alt[i]) <= gate) {
      const t = T[i], n = nAvg[i];
      T[i] = alt[i]; nAvg[i] = Math.min(altN[i], maxN); alt[i] = t; altN[i] = n;
    }
    const v = z - T[i];
    if (Math.abs(v) <= gate) {                            // consistent: extend the average
      const n = Math.min(nAvg[i] + 1, maxN);
      nAvg[i] = n;
      T[i] += v / n;
      R[i] = Math.max(floor2, R[i] + NOISE_BETA * (v * v - R[i]));
      jumpRate[i] *= 1 - JUMP_BETA;
      candCnt[i] = 0;
    } else {                                              // unknown value: candidate for a change
      jumpRate[i] += JUMP_BETA * (1 - jumpRate[i]);
      if (candCnt[i] > 0 && Math.abs(z - cand[i]) <= gate) {
        candCnt[i]++; cand[i] += (z - cand[i]) / candCnt[i];
      } else { cand[i] = z; candCnt[i] = 1; }
      if (!on || candCnt[i] >= confirm) {                 // confirmed → follow; old surface becomes the 2nd mode
        if (nAvg[i] >= 3) { alt[i] = T[i]; altN[i] = nAvg[i]; }
        T[i] = cand[i]; nAvg[i] = candCnt[i]; candCnt[i] = 0;
      }
    }
  }
}

// ---------- stage 2b: history filter + confidence ----------
// From the last 32 scans: valid ratio and jump rate. Beams that are rarely valid or keep
// jumping are dropped; the rest get a confidence weight that later stages multiply into
// their neighbour weights (stable, low-noise beams count more).
const popcount = x => { x -= (x >>> 1) & 0x55555555; x = (x & 0x33333333) + ((x >>> 2) & 0x33333333); return (((x + (x >>> 4)) & 0x0f0f0f0f) * 0x01010101) >>> 24; };
function historyFilter(src, dst) {
  const c = cfg.history, { N, validBits, jumpRate, noiseVar, conf } = G;
  const mask = G.frames >= 32 ? 0xffffffff : ((1 << G.frames) - 1) >>> 0;
  const floor2 = cfg.temporal.noiseFloor ** 2;
  let dropped = 0;
  for (let i = 0; i < N; i++) {
    const d = src[i];
    dst[i] = d; conf[i] = 1;
    if (d <= 0 || !c.on || isMoving(i)) continue;          // moving objects flicker by nature: keep them
    const valid = popcount(validBits[i] & mask) / Math.max(1, G.frames);
    if (valid < c.minValid || jumpRate[i] > c.maxJump) { dst[i] = 0; dropped++; continue; }
    if (c.weight > 0) {
      const quality = valid * (1 - jumpRate[i]) * floor2 / Math.max(floor2, noiseVar[i]);   // 1 = always valid, steady, at the noise floor
      conf[i] = Math.pow(Math.max(1e-3, quality), c.weight);
    }
  }
  return dropped;
}

// ---------- stage 3: spatial smoothing (bilateral filter on the range image) ----------
// Weighted mean of neighbouring ranges: weight falls off with pixel distance (spatial term)
// and with range difference (range term), so surfaces are smoothed but depth edges are kept.
function bilateral(src, dst) {
  const c = cfg.spatial, { L, B } = G;
  if (!c.on) { dst.set(src); return; }
  const sb = Math.max(1, c.wb / 2), sl = 1;
  for (let l = 0; l < L; l++) for (let b = 0; b < B; b++) {
    const i = l * B + b, d = src[i];
    if (d <= 0) { dst[i] = 0; continue; }
    const moving = isMoving(i), wb = moving ? Math.min(c.wb, cfg.adaptive.dynSpatial) : c.wb, wl = moving ? 0 : c.wl;
    if (wb === 0 && wl === 0) { dst[i] = d; continue; }
    const sr = Math.max(sameTol(d, c.srAbs, c.srRel), c.srNoise * Math.sqrt(G.noiseVar[i])), cut = 3 * sr;
    let ws = 0, acc = 0;
    for (let dl = -wl; dl <= wl; dl++) {
      const ll = l + dl;
      if (ll < 0 || ll >= L) continue;
      for (let db = -wb; db <= wb; db++) {
        const bb = b + db;
        if (bb < 0 || bb >= B) continue;
        const j = ll * B + bb, v = src[j];
        if (v <= 0 || Math.abs(v - d) > cut) continue;
        const w = G.conf[j] * Math.exp(-(db * db) / (2 * sb * sb) - (dl * dl) / (2 * sl * sl) - ((v - d) * (v - d)) / (2 * sr * sr));
        ws += w; acc += w * v;
      }
    }
    dst[i] = acc / ws;
  }
}

// ---------- stage 4: plane flattening (local PCA plane fit, an MLS-style projection) ----------
// For each point: gather same-surface neighbours in a window, fit a plane (smallest
// eigenvector of the covariance), and if the patch is planar enough move the point along
// its own laser ray onto that plane. Flat walls/floors become flat; curved or cluttered
// patches fail the planarity test and are left alone.

function smallestEigenvector(xx, xy, xz, yy, yz, zz, out) {
  // eigenvalues of a symmetric 3x3 matrix (trigonometric method), then the eigenvector of
  // the smallest one as the largest cross product of two rows of (A - λI)
  const p1 = xy * xy + xz * xz + yz * yz, q = (xx + yy + zz) / 3;
  const p2 = (xx - q) ** 2 + (yy - q) ** 2 + (zz - q) ** 2 + 2 * p1;
  const p = Math.sqrt(p2 / 6);
  if (p < 1e-12) return -1;
  const b11 = (xx - q) / p, b22 = (yy - q) / p, b33 = (zz - q) / p, b12 = xy / p, b13 = xz / p, b23 = yz / p;
  const r = Math.max(-1, Math.min(1, (b11 * (b22 * b33 - b23 * b23) - b12 * (b12 * b33 - b23 * b13) + b13 * (b12 * b23 - b22 * b13)) / 2));
  const phi = Math.acos(r) / 3;
  const e1 = q + 2 * p * Math.cos(phi), e3 = q + 2 * p * Math.cos(phi + 2 * Math.PI / 3);
  const lam = e3;                                   // smallest
  const r0 = [xx - lam, xy, xz], r1 = [xy, yy - lam, yz], r2 = [xz, yz, zz - lam];
  const cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  let best = null, bn = 0;
  for (const c of [cr(r0, r1), cr(r0, r2), cr(r1, r2)]) {
    const n = c[0] * c[0] + c[1] * c[1] + c[2] * c[2];
    if (n > bn) { bn = n; best = c; }
  }
  if (bn < 1e-24) return -1;
  const s = 1 / Math.sqrt(bn);
  out[0] = best[0] * s; out[1] = best[1] * s; out[2] = best[2] * s;
  return lam / Math.max(1e-12, xx + yy + zz);       // surface variation ("curvature")
}

function flattenPlanes(src, dst) {
  const c = cfg.planes, { L, B, rayX, rayY, rayZ, area } = G;
  for (let i = 0; i < G.N; i++) area[i] = isMoving(i) ? 2 : 1;      // default: static detail
  if (!c.on) { dst.set(src); return; }
  const nrm = [0, 0, 0];
  for (let l = 0; l < L; l++) for (let b = 0; b < B; b++) {
    const i = l * B + b, d = src[i];
    dst[i] = d;
    if (d <= 0 || area[i] === 2) continue;                 // moving areas are not flattened
    const tol = sameTol(d, c.tolAbs, c.tolRel);
    let n = 0, W = 0, sx = 0, sy = 0, sz = 0, sxx = 0, sxy = 0, sxz = 0, syy = 0, syz = 0, szz = 0;
    for (let ll = Math.max(0, l - c.wl); ll <= Math.min(L - 1, l + c.wl); ll++) {
      for (let bb = Math.max(0, b - c.wb); bb <= Math.min(B - 1, b + c.wb); bb++) {
        const j = ll * B + bb, v = src[j];
        if (v <= 0 || Math.abs(v - d) > tol) continue;
        const x = rayX[j] * v, y = rayY[j] * v, z = rayZ[j] * v;
        const w = G.conf[j];                             // confidence-weighted PCA
        n++; W += w; sx += w * x; sy += w * y; sz += w * z;
        sxx += w * x * x; sxy += w * x * y; sxz += w * x * z; syy += w * y * y; syz += w * y * z; szz += w * z * z;
      }
    }
    if (n < c.minPts) continue;
    if (W <= 0) continue;
    const cx = sx / W, cy = sy / W, cz = sz / W;
    const variation = smallestEigenvector(sxx / W - cx * cx, sxy / W - cx * cy, sxz / W - cx * cz,
                                          syy / W - cy * cy, syz / W - cy * cz, szz / W - cz * cz, nrm);
    if (variation < 0) continue;
    if (c.noiseFlat > 0) {                                  // flat = residual within the sensor noise
      const trace = (sxx + syy + szz) / W - (cx * cx + cy * cy + cz * cz);
      if (Math.sqrt(Math.max(0, variation * trace)) > c.noiseFlat * cfg.temporal.noiseFloor) continue;
    } else if (variation > c.planarity) continue;
    area[i] = 0;                                            // static & flat
    // intersect this beam's ray with the fitted plane: t·(n·ray) = n·centroid
    const nr = nrm[0] * rayX[i] + nrm[1] * rayY[i] + nrm[2] * rayZ[i];
    if (Math.abs(nr) < c.minCos) continue;              // grazing incidence: unstable
    const t = (nrm[0] * cx + nrm[1] * cy + nrm[2] * cz) / nr;
    if (t > 0 && Math.abs(t - d) <= tol) dst[i] = t;
  }
}

const AREA_COLORS = [[0.29, 0.64, 1.0], [0.25, 0.73, 0.31], [0.97, 0.32, 0.29]];   // flat · detail · moving

// ---------- stage 5: geometry (points, layer lines, mesh) ----------
let lastStats = { removed: 0 };
function buildGeometry(D) {
  const { L, B, N, rayX, rayY, rayZ } = G;
  const P = G.pos.array, C = G.col.array, Nn = G.nrm.array;
  const vis = new Uint8Array(N);
  const vals = new Float32Array(N);
  let np = 0, nl = 0, nt = 0;
  const jumpOk = (a, b) => Math.abs(D[a] - D[b]) <= sameTol(Math.min(D[a], D[b]), cfg.mesh.jump, cfg.mesh.jumpRel);

  for (let l = 0; l < L; l++) for (let b = 0; b < B; b++) {
    const i = l * B + b, d = D[i];
    const ok = d > 0 && d <= ui.maxRange && (ui.layer < 0 || ui.layer === l);
    vis[i] = ok;
    if (!ok) continue;
    P[3 * i] = rayX[i] * d; P[3 * i + 1] = rayY[i] * d; P[3 * i + 2] = rayZ[i] * d;
    vals[i] = ui.colorBy === "area" ? G.area[i] : ui.colorBy === "rssi" ? G.rssi[i] : ui.colorBy === "dist" ? d : ui.colorBy === "height" ? P[3 * i + 2]
      : ui.colorBy === "noise" ? Math.sqrt(G.noiseVar[i]) * 1000 : ui.colorBy === "conf" ? G.conf[i] : l;
    G.pIdx[np++] = i;
    if (b > 0 && vis[i - 1] && jumpOk(i, i - 1)) { G.lIdx[2 * nl] = i - 1; G.lIdx[2 * nl + 1] = i; nl++; }
  }

  // organized fast mesh: each grid cell (two beams × two layers) becomes up to two triangles,
  // split along the shorter diagonal; triangles spanning a depth jump are dropped
  Nn.fill(0);
  const addTri = (a, b, c) => {
    G.tIdx[3 * nt] = a; G.tIdx[3 * nt + 1] = b; G.tIdx[3 * nt + 2] = c; nt++;
    const ax = P[3 * a], ay = P[3 * a + 1], az = P[3 * a + 2];
    const ux = P[3 * b] - ax, uy = P[3 * b + 1] - ay, uz = P[3 * b + 2] - az;
    const vx = P[3 * c] - ax, vy = P[3 * c + 1] - ay, vz = P[3 * c + 2] - az;
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;   // area-weighted
    for (const k of [a, b, c]) { Nn[3 * k] += nx; Nn[3 * k + 1] += ny; Nn[3 * k + 2] += nz; }
  };
  for (let l = 0; l < L - 1; l++) for (let b = 0; b < B - 1; b++) {
    const a = l * B + b, r = a + 1, u = a + B, ur = u + 1;
    const diag1 = vis[a] && vis[ur] && jumpOk(a, ur);    // a–ur diagonal
    const diag2 = vis[r] && vis[u] && jumpOk(r, u);      // r–u diagonal
    const useFirst = diag1 && (!diag2 || Math.abs(D[a] - D[ur]) <= Math.abs(D[r] - D[u]));
    if (useFirst) {
      if (vis[r] && jumpOk(a, r) && jumpOk(r, ur)) addTri(a, r, ur);
      if (vis[u] && jumpOk(a, u) && jumpOk(u, ur)) addTri(a, ur, u);
    } else if (diag2) {
      if (vis[a] && jumpOk(a, r) && jumpOk(a, u)) addTri(a, r, u);
      if (vis[ur] && jumpOk(r, ur) && jumpOk(u, ur)) addTri(r, ur, u);
    }
  }
  for (let i = 0; i < N; i++) {
    const x = Nn[3 * i], y = Nn[3 * i + 1], z = Nn[3 * i + 2], s = Math.hypot(x, y, z);
    if (s > 0) { Nn[3 * i] = x / s; Nn[3 * i + 1] = y / s; Nn[3 * i + 2] = z / s; }
    else { Nn[3 * i] = -rayX[i]; Nn[3 * i + 1] = -rayY[i]; Nn[3 * i + 2] = -rayZ[i]; }
  }

  // colours (robust 2nd..98th percentile scaling)
  let lo = 0, hi = 1;
  if (ui.colorBy === "layer") { lo = 0; hi = L - 1; }
  else if (ui.colorBy === "conf") { lo = 0; hi = 1; }
  else if (ui.colorBy !== "uniform" && np) {
    const step = Math.max(1, Math.floor(np / 4000)), s = [];
    for (let k = 0; k < np; k += step) s.push(vals[G.pIdx[k]]);
    s.sort((x, y) => x - y);
    lo = s[Math.floor(s.length * 0.02)]; hi = s[Math.floor(s.length * 0.98)];
    if (hi <= lo) hi = lo + 1;
  }
  for (let k = 0; k < np; k++) {
    const i = G.pIdx[k];
    const [r, g, b] = ui.colorBy === "uniform" ? [0.78, 0.8, 0.83] : ui.colorBy === "area" ? AREA_COLORS[vals[i]]
      : turbo((vals[i] - lo) / (hi - lo));
    C[3 * i] = r; C[3 * i + 1] = g; C[3 * i + 2] = b;
  }
  const unit = { rssi: "", dist: " m", height: " m", layer: "", uniform: "", noise: " mm", conf: "" }[ui.colorBy];
  const fmt = v => ui.colorBy === "dist" || ui.colorBy === "height" ? v.toFixed(1) : ui.colorBy === "conf" ? v.toFixed(2) : Math.round(v);
  const isArea = ui.colorBy === "area", sw = c => `<span style="color:rgb(${c.map(v => v * 255 | 0)})">■</span>`;
  $("legend").style.visibility = isArea ? "hidden" : "";
  if (isArea) {
    let n = [0, 0, 0];
    for (let k = 0; k < np; k++) n[G.area[G.pIdx[k]]]++;
    $("legMin").innerHTML = `${sw(AREA_COLORS[0])} flat ${n[0]}  ${sw(AREA_COLORS[1])} detail ${n[1]}`;
    $("legMax").innerHTML = `${sw(AREA_COLORS[2])} moving ${n[2]}`;
  } else { $("legMin").textContent = fmt(lo) + unit; $("legMax").textContent = fmt(hi) + unit; }

  pointsObj.geometry.setDrawRange(0, np);
  G.np = np; G.nl = nl; G.vis = vis;
  linesObj.geometry.setDrawRange(0, nl * 2);
  meshObj.geometry.setDrawRange(0, nt * 3);
  for (const o of [pointsObj, linesObj, meshObj]) o.geometry.index.needsUpdate = true;
  G.pos.needsUpdate = G.col.needsUpdate = G.nrm.needsUpdate = true;
  $("tris").textContent = nt.toLocaleString();
}

// unit ray per beam in the world frame (x forward, y left, z up). Upright: negative elevation
// points down. Upside down (sensor on its head): only the vertical flips — with the device's
// UpsideDown parameter set, the sensor already reports azimuth in world left/right, so y must
// NOT change sign (doing so mirrored the scene). Same convention as SICK's own viewer.
function updateRays(az0, step) {
  const { L, B } = G, zs = ui.mount === "upsidedown" ? -1 : 1;
  for (let l = 0; l < L; l++) for (let b = 0; b < B; b++) {
    const i = l * B + b, az = (az0 + b * step) * DEG, el = G.elev[i] * DEG;
    G.rayX[i] = Math.cos(az) * Math.cos(el); G.rayY[i] = Math.sin(az) * Math.cos(el); G.rayZ[i] = zs * Math.sin(el);
  }
}

function showRemoved() {
  const parts = [["intensity", cfg.intensity.on], ["outliers", cfg.outlier.on], ["flicker", cfg.history.on]]
    .filter(([, on]) => on).map(([k]) => `${lastStats[k] || 0} ${k}`);
  $("removed").textContent = parts.length ? parts.join(" · ") : "–";
}

// re-run the spatial stages and geometry on the current temporal state (UI changes, new frames)
let gridMeta = null;
function rebuild() {
  needsRender = true;
  if (!G) return;
  const t0 = performance.now();
  updateRays(gridMeta.start_azimuth_deg, gridMeta.step_deg);
  lastStats.flicker = historyFilter(G.temporal, G.hist);
  bilateral(G.hist, G.work);
  flattenPlanes(G.work, G.out);
  buildGeometry(G.out);
  render2d();
  showRemoved();
  $("proc").textContent = (performance.now() - t0 + lastStats.ms).toFixed(0) + " ms";
}

function ingest(buf, meta) {
  const L = meta.layers, B = meta.beams, N = L * B;
  if (!G || G.L !== L || G.B !== B) {
    allocGrid(L, B);
    $("layerSel").innerHTML = '<option value="-1">all</option>' +
      Array.from({ length: L }, (_, i) => `<option value="${i}">${i}</option>`).join("");
  }
  gridMeta = meta;
  const f = new Float32Array(buf);
  const t0 = performance.now();
  G.rssi.set(f.subarray(N, 2 * N));
  G.elev.set(f.subarray(2 * N, 3 * N));
  const raw = f.subarray(0, N);
  G.rawIn.set(raw);
  // RSSI histogram (8 units per bin) for the intensity panel, then the intensity filter
  const hist = new Uint32Array(50);
  for (let i = 0; i < N; i++) if (raw[i] > 0) hist[Math.min(49, G.rssi[i] >> 3)]++;
  rssiHist = hist; drawHistogram();
  let intensity = 0;
  const ci = cfg.intensity, inp = G.work;          // work is free scratch until rebuild()
  for (let i = 0; i < N; i++) {
    const keep = raw[i] > 0 && (!ci.on || (G.rssi[i] >= ci.min && G.rssi[i] <= ci.max));
    if (raw[i] > 0 && !keep) intensity++;
    inp[i] = keep ? raw[i] : 0;
  }
  if (layerBias.length !== L) layerBias = new Float32Array(L);
  if (cfg.layercal.on) for (let l = 0; l < L; l++) {
    const off = layerBias[l];
    for (let i = l * B; i < (l + 1) * B; i++) if (inp[i] > 0) inp[i] += off;
  }
  G.frames = Math.min(G.frames + 1, 32);
  detectMotion(inp);                               // on the unfiltered scan, so moving parts are seen whole
  const outliers = rejectOutliers(inp, G.raw);     // relaxed inside moving areas
  temporalUpdate(G.raw);
  if (cfg.layercal.on && cfg.layercal.rate > 0 && ++calFrame % 10 === 0 && gridMeta) {
    updateRays(gridMeta.start_azimuth_deg, gridMeta.step_deg);
    updateLayerBias(G.temporal);
  }
  if (mode === "auto" && ++autoFrame % 10 === 0) { autoTune(); syncControls(); }
  lastStats = { intensity, outliers, flicker: 0, ms: performance.now() - t0 };
  if (!viewDist) {                              // first scan: frame the scene
    fanElev = [G.elev[B >> 1], G.elev[(L - 1) * B + (B >> 1)]];
    buildGuides(Math.min(ui.maxRange, 200));
    const s = [];
    for (let i = 0; i < N; i += 7) if (G.raw[i] > 0) s.push(G.raw[i]);
    s.sort((a, b) => a - b);
    if (s.length) { viewDist = s[Math.floor(s.length * 0.9)]; setView("persp"); }
  }
  rebuild();
}

// ---------- 2D views ----------
// "top": orthographic bird's-eye map, sensor at the bottom looking up (x forward → up, y left → left).
// "image": the organized range image itself, layers as rows (top = highest), beams as columns
// (left = +60°, as seen from behind the sensor). Both draw the same filtered data and colours.
ui.mode = "3d";
const cv2 = $("view2d"), ctx2 = cv2.getContext("2d"), tip = $("tip");
const v2 = { scale: 0, cx: 0, cy: 0 };            // top view: px per metre, sensor position (CSS px)
let dpr = 1;
const off = document.createElement("canvas"), offCtx = off.getContext("2d");
const panelWidth = () => (innerWidth > 600 ? 304 : 0);

function size2d() {
  dpr = window.devicePixelRatio || 1;
  cv2.width = Math.round(innerWidth * dpr); cv2.height = Math.round(innerHeight * dpr);
}
window.addEventListener("resize", () => { size2d(); render2d(); });
size2d();

function setMode(m) {
  ui.mode = m;
  for (const b of $("modeBtns").children) b.classList.toggle("on", b.dataset.mode === m);
  container.hidden = m !== "3d"; cv2.hidden = m === "3d";
  $("cam3d").hidden = m !== "3d"; $("fit2d").hidden = m === "3d";
  $("hint").textContent = m === "3d" ? "drag: rotate · right-drag: pan · wheel: zoom · space: pause"
    : m === "top" ? "drag: pan · wheel: zoom · double-click: fit · hover: inspect · space: pause"
    : "drag: pan · wheel: zoom · double-click: fit · grey = no return, pink = removed by filters · space: pause";
  tip.hidden = true;
  if (m === "top" && !v2.scale) fit2d();
  if (m === "3d") resize();
  render2d();
  try { localStorage.setItem("mrs6000.view", m); } catch (e) {}
}
for (const b of $("modeBtns").children) b.onclick = () => setMode(b.dataset.mode);
$("fit2d").onclick = () => { ui.mode === "top" ? fit2d() : fitImage(); render2d(); };

function fit2d() {
  const pw = panelWidth(), W = innerWidth - pw, H = innerHeight;
  const r = Math.max(2, Math.min(viewDist || ui.maxRange, ui.maxRange) * 1.1);
  v2.scale = Math.min((W - 40) / (2 * r * Math.sin(60 * DEG)), (H - 70) / r);   // ±60° wedge fits
  v2.cx = pw + W / 2; v2.cy = H - 35;
}

const css = c => `rgb(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0})`;
function render2d() {
  if (ui.mode === "3d") return;
  const W = cv2.width, H = cv2.height;
  ctx2.setTransform(1, 0, 0, 1, 0, 0);
  ctx2.fillStyle = "#0e1116"; ctx2.fillRect(0, 0, W, H);
  ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);          // draw in CSS pixels from here on
  if (!G || !G.vis) {
    ctx2.fillStyle = "#8b95a3"; ctx2.font = "14px system-ui"; ctx2.fillText("waiting for scan data…", panelWidth() + 30, 40);
    return;
  }
  ui.mode === "top" ? renderTop() : renderImage();
}

// ---- top-down map ----
function niceStep(minPx) {                          // grid spacing ≥ minPx on screen
  for (const s of [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100]) if (s * v2.scale >= minPx) return s;
  return 200;
}
function renderTop() {
  const { scale: s, cx, cy } = v2, P = G.pos.array, C = G.col.array;
  const toX = y => cx - y * s, toY = x => cy - x * s;
  const maxR = Math.min(ui.maxRange, 250);

  // range rings, FOV wedge, labels
  const step = niceStep(60);
  ctx2.lineWidth = 1; ctx2.font = "11px system-ui"; ctx2.textAlign = "left";
  for (let r = step; r <= maxR; r += step) {
    ctx2.strokeStyle = Math.round(r / step) % 2 === 0 ? "#3d4654" : "#262d37";
    ctx2.beginPath(); ctx2.arc(cx, cy, r * s, -Math.PI / 2 - 70 * DEG, -Math.PI / 2 + 70 * DEG); ctx2.stroke();
    ctx2.fillStyle = "#6e7887"; ctx2.fillText(`${+r.toFixed(1)} m`, cx + 4, cy - r * s - 3);
  }
  ctx2.strokeStyle = "rgba(74,163,255,0.4)";
  for (const a of [-60, 60]) {
    ctx2.beginPath(); ctx2.moveTo(cx, cy);
    ctx2.lineTo(cx - Math.sin(a * DEG) * maxR * s, cy - Math.cos(a * DEG) * maxR * s); ctx2.stroke();
  }

  // layer lines (also used for "surface": seen from above, surfaces are lines)
  if (!ui.draw.startsWith("points") || ui.draw.includes("lines")) {
    const paths = new Map();
    for (let k = 0; k < G.nl; k++) {
      const a = G.lIdx[2 * k], b = G.lIdx[2 * k + 1];
      const key = ((C[3 * a] * 15 + 0.5) | 0) << 8 | ((C[3 * a + 1] * 15 + 0.5) | 0) << 4 | ((C[3 * a + 2] * 15 + 0.5) | 0);
      let p = paths.get(key);
      if (!p) { p = new Path2D(); paths.set(key, p); }
      p.moveTo(toX(P[3 * a + 1]), toY(P[3 * a])); p.lineTo(toX(P[3 * b + 1]), toY(P[3 * b]));
    }
    ctx2.lineWidth = 1;
    for (const [key, p] of paths) {
      ctx2.strokeStyle = `rgb(${(key >> 8) * 17},${((key >> 4) & 15) * 17},${(key & 15) * 17})`;
      ctx2.stroke(p);
    }
  }

  // points: rasterised into an offscreen image (fast for ~22k points), then composited
  if (ui.draw.includes("points") || !ui.draw.startsWith("surface") && !ui.draw.includes("lines")) {
    const W = cv2.width, H = cv2.height;
    if (off.width !== W || off.height !== H) { off.width = W; off.height = H; }
    const img = offCtx.createImageData(W, H), px = new Uint32Array(img.data.buffer);
    const sz = Math.max(1, Math.round(pointMat.size * dpr)), half = sz >> 1;
    for (let k = 0; k < G.np; k++) {
      const i = G.pIdx[k];
      const X = Math.round(toX(P[3 * i + 1]) * dpr) - half, Y = Math.round(toY(P[3 * i]) * dpr) - half;
      if (X < 0 || Y < 0 || X + sz > W || Y + sz > H) continue;
      const c = 0xff000000 | ((C[3 * i + 2] * 255) << 16) | ((C[3 * i + 1] * 255) << 8) | (C[3 * i] * 255);
      for (let dy = 0; dy < sz; dy++) px.fill(c, (Y + dy) * W + X, (Y + dy) * W + X + sz);
    }
    offCtx.putImageData(img, 0, 0);
    ctx2.setTransform(1, 0, 0, 1, 0, 0); ctx2.drawImage(off, 0, 0); ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // sensor + scale bar
  ctx2.fillStyle = "#ffd33d";
  ctx2.beginPath(); ctx2.moveTo(cx, cy - 9); ctx2.lineTo(cx - 6, cy + 5); ctx2.lineTo(cx + 6, cy + 5); ctx2.closePath(); ctx2.fill();
  const bar = niceStep(80), bx = innerWidth - 30 - bar * s, by = innerHeight - 40;
  ctx2.strokeStyle = ctx2.fillStyle = "#d7dde5"; ctx2.lineWidth = 2;
  ctx2.beginPath(); ctx2.moveTo(bx, by); ctx2.lineTo(bx + bar * s, by); ctx2.stroke();
  ctx2.textAlign = "center"; ctx2.fillText(`${bar} m`, bx + bar * s / 2, by - 6);
}

// ---- range image ----
function renderImage() {
  const { L, B, vis } = G, C = G.col.array, D = G.out;
  if (off.width !== B || off.height !== L) { off.width = B; off.height = L; }
  const img = offCtx.createImageData(B, L), px = new Uint32Array(img.data.buffer);
  // with "uniform" colouring the image would be blank, so colour by distance instead
  let lo = 0, hi = 1;
  const byDist = ui.colorBy === "uniform";
  if (byDist) {
    const smp = [];
    for (let i = 0; i < G.N; i += 5) if (vis[i]) smp.push(D[i]);
    smp.sort((a, b) => a - b);
    if (smp.length) { lo = smp[Math.floor(smp.length * 0.02)]; hi = Math.max(lo + 0.1, smp[Math.floor(smp.length * 0.98)]); }
  }
  for (let l = 0; l < L; l++) for (let b = 0; b < B; b++) {
    const i = l * B + b, o = (L - 1 - l) * B + (B - 1 - b);
    let r, g, bl;
    if (vis[i]) {
      if (byDist) [r, g, bl] = turbo((D[i] - lo) / (hi - lo));
      else { r = C[3 * i]; g = C[3 * i + 1]; bl = C[3 * i + 2]; }
      px[o] = 0xff000000 | ((bl * 255) << 16) | ((g * 255) << 8) | (r * 255);
    } else px[o] = G.rawIn[i] > 0 ? 0xffd84fff : 0xff3a342e;   // removed by filters (pink) : no return (grey)
  }
  offCtx.putImageData(img, 0, 0);

  // square cells: one beam × one layer = cell × cell CSS px, snapped to whole device pixels
  const A = imgArea();
  if (!vi.cell) fitImage();
  const gw = B * vi.cell, gh = L * vi.cell;
  ctx2.save();
  ctx2.beginPath(); ctx2.rect(A.left, A.top, A.w, A.h); ctx2.clip();
  ctx2.imageSmoothingEnabled = false;
  ctx2.drawImage(off, vi.ox, vi.oy, gw, gh);
  if (vi.cell * dpr >= 8) {                       // zoomed in: faint cell borders so single beams stay readable
    const x0 = Math.max(0, Math.floor((A.left - vi.ox) / vi.cell)), x1 = Math.min(B, Math.ceil((A.left + A.w - vi.ox) / vi.cell));
    const y0 = Math.max(0, Math.floor((A.top - vi.oy) / vi.cell)), y1 = Math.min(L, Math.ceil((A.top + A.h - vi.oy) / vi.cell));
    ctx2.beginPath();
    for (let x = x0; x <= x1; x++) { ctx2.moveTo(vi.ox + x * vi.cell, vi.oy + y0 * vi.cell); ctx2.lineTo(vi.ox + x * vi.cell, vi.oy + y1 * vi.cell); }
    for (let y = y0; y <= y1; y++) { ctx2.moveTo(vi.ox + x0 * vi.cell, vi.oy + y * vi.cell); ctx2.lineTo(vi.ox + x1 * vi.cell, vi.oy + y * vi.cell); }
    ctx2.strokeStyle = "rgba(14,17,22,0.35)"; ctx2.lineWidth = 1 / dpr; ctx2.stroke();
  }
  ctx2.strokeStyle = "#2a313c"; ctx2.lineWidth = 1; ctx2.strokeRect(vi.ox - 0.5, vi.oy - 0.5, gw + 1, gh + 1);
  ctx2.restore();

  // axes follow pan/zoom: azimuth under the grid, layer elevation on the left of the plot area
  ctx2.fillStyle = "#8b95a3"; ctx2.font = "11px system-ui"; ctx2.textAlign = "center";
  const az0 = gridMeta.start_azimuth_deg, azStep = gridMeta.step_deg;
  const tick = [0.5, 1, 2, 5, 10, 20, 30].find(t => t / azStep * vi.cell >= 50) || 30;
  const axisY = Math.min(vi.oy + gh, A.top + A.h);
  for (let a = Math.ceil(az0 / tick) * tick; a <= az0 + (B - 1) * azStep + 1e-9; a += tick) {
    const x = vi.ox + (B - 1 - (a - az0) / azStep + 0.5) * vi.cell;
    if (x < A.left || x > A.left + A.w) continue;
    ctx2.fillRect(x, axisY, 1, 4); ctx2.fillText(`${+a.toFixed(1)}°`, x, axisY + 16);
  }
  ctx2.fillText("azimuth (left = sensor's left)", A.left + A.w / 2, axisY + 32);
  ctx2.textAlign = "right";
  const every = Math.max(1, Math.ceil(14 / vi.cell));
  for (let l = 0; l < L; l += every) {
    const y = vi.oy + (L - 1 - l + 0.5) * vi.cell;
    if (y < A.top || y > A.top + A.h) continue;
    ctx2.fillText(`${G.elev[l * B + (B >> 1)].toFixed(1)}°`, A.left - 6, y + 4);
  }
  ctx2.textAlign = "left";
  ctx2.fillText(`${(vi.cell * dpr).toFixed(0)} px per beam` +
    (byDist ? `  ·  colour: distance ${lo.toFixed(1)}–${hi.toFixed(1)} m (pick a colour mode to change)` : ""), A.left, A.top - 12);
}

// range image view state: cell size (CSS px) and screen position of the grid's top-left corner
const vi = { cell: 0, ox: 0, oy: 0 };
const imgArea = () => { const left = panelWidth() + 70, top = 40; return { left, top, w: innerWidth - left - 30, h: innerHeight - top - 70 }; };
const snapCell = c => Math.max(1, Math.round(c * dpr)) / dpr;      // whole device pixels → crisp squares
function fitImage() {                                               // full width, top-aligned
  if (!G) return;
  const A = imgArea();
  vi.cell = Math.max(1, Math.floor(A.w * dpr / G.B)) / dpr;
  vi.ox = A.left + (A.w - G.B * vi.cell) / 2; vi.oy = A.top;
}
window.addEventListener("resize", () => { vi.cell = 0; });

// ---- interaction ----
let drag = null;
cv2.addEventListener("pointerdown", e => { if (ui.mode !== "3d") { drag = { x: e.clientX, y: e.clientY }; cv2.setPointerCapture(e.pointerId); } });
cv2.addEventListener("pointerup", () => { drag = null; });
cv2.addEventListener("pointermove", e => {
  if (drag) {
    const t = ui.mode === "top" ? v2 : null, dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (t) { t.cx += dx; t.cy += dy; } else { vi.ox += dx; vi.oy += dy; }
    drag = { x: e.clientX, y: e.clientY };
    tip.hidden = true; render2d(); return;
  }
  inspect(e.clientX, e.clientY);
});
cv2.addEventListener("pointerleave", () => { tip.hidden = true; });
cv2.addEventListener("wheel", e => {
  if (ui.mode === "3d") return;
  e.preventDefault();
  let f = Math.exp(-e.deltaY * 0.0015);
  if (ui.mode === "top") {
    v2.cx = e.clientX - (e.clientX - v2.cx) * f; v2.cy = e.clientY - (e.clientY - v2.cy) * f; v2.scale *= f;
  } else if (vi.cell) {
    // zoom in whole-device-pixel steps so cells stay square and crisp
    let c = snapCell(vi.cell * f);
    if (c === vi.cell) c = snapCell(vi.cell + Math.sign(f - 1) / dpr);
    c = Math.min(80, Math.max(1 / dpr, c));
    f = c / vi.cell;
    vi.ox = e.clientX - (e.clientX - vi.ox) * f; vi.oy = e.clientY - (e.clientY - vi.oy) * f; vi.cell = c;
  }
  render2d();
}, { passive: false });
cv2.addEventListener("dblclick", () => { if (ui.mode === "top") fit2d(); else if (ui.mode === "image") fitImage(); render2d(); });

function inspect(mx, my) {
  if (!G || !G.vis) return;
  let i = -1;
  if (ui.mode === "top") {
    const P = G.pos.array; let best = 64;                 // within 8 px
    for (let k = 0; k < G.np; k++) {
      const j = G.pIdx[k], dx = v2.cx - P[3 * j + 1] * v2.scale - mx, dy = v2.cy - P[3 * j] * v2.scale - my, d2 = dx * dx + dy * dy;
      if (d2 < best) { best = d2; i = j; }
    }
  } else if (vi.cell) {
    const A = imgArea(), cb = Math.floor((mx - vi.ox) / vi.cell), cl = Math.floor((my - vi.oy) / vi.cell);
    if (mx >= A.left && mx < A.left + A.w && my >= A.top && my < A.top + A.h && cb >= 0 && cb < G.B && cl >= 0 && cl < G.L)
      i = (G.L - 1 - cl) * G.B + (G.B - 1 - cb);
  }
  if (i < 0) { tip.hidden = true; return; }
  const l = Math.floor(i / G.B), b = i % G.B;
  const mask = G.frames >= 32 ? 0xffffffff : ((1 << G.frames) - 1) >>> 0;
  const valid = popcount(G.validBits[i] & mask) / Math.max(1, G.frames);
  const status = G.vis[i] ? "" : G.rawIn[i] > 0 ? "\nremoved by filters" : "\nno return";
  tip.textContent =
    `layer ${l}  ·  beam ${b}\n` +
    `azimuth ${(gridMeta.start_azimuth_deg + b * gridMeta.step_deg).toFixed(2)}°  elevation ${G.elev[i].toFixed(2)}°\n` +
    `distance ${G.out[i] > 0 ? G.out[i].toFixed(3) + " m" : "–"}  (raw ${G.rawIn[i] > 0 ? G.rawIn[i].toFixed(3) + " m" : "–"})\n` +
    `RSSI ${G.rssi[i]}  ·  noise σ ${(Math.sqrt(G.noiseVar[i]) * 1000).toFixed(0)} mm  ·  layer offset ${cfg.layercal.on ? (layerBias[l] * 1000).toFixed(1) + " mm" : "off"}\n` +
    `valid ${(valid * 100).toFixed(0)} %  ·  jump rate ${(G.jumpRate[i] * 100).toFixed(0)} %  ·  conf ${G.conf[i].toFixed(2)}` + status;
  tip.hidden = false;
  tip.style.left = Math.min(mx + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(my + 14, innerHeight - tip.offsetHeight - 8) + "px";
}

try { const m = localStorage.getItem("mrs6000.view"); if (m && m !== "3d") setMode(m); } catch (e) {}

// ---------- data feed (long-poll) ----------
let lastId = 0, lastFrameAt = 0;
async function pollFrames() {
  for (;;) {
    try {
      const r = await fetch(`/frame?after=${lastId}`, { cache: "no-store" });
      const meta = JSON.parse(r.headers.get("X-Meta") || "{}");
      const buf = await r.arrayBuffer();
      if (meta.id && meta.id !== lastId && buf.byteLength) {
        lastId = meta.id; lastFrameAt = performance.now();
        $("rate").textContent = meta.rate.toFixed(1) + " Hz";
        $("points").textContent = meta.points.toLocaleString();
        $("geom").textContent = `${meta.layers} × ${meta.beams}`;
        if (meta.replay) $("subtitle").textContent = "replaying a recording (looped)";
        if (!ui.paused) ingest(buf, meta);
      }
      $("err").textContent = "";
    } catch (e) {
      $("err").textContent = "viewer server unreachable – is viewer.py running?";
      console.error(e);
      await new Promise(res => setTimeout(res, 1000));
    }
  }
}

const STATUS = { 0: "unknown", 1: "startup", 2: "service mode", 3: "normal", 4: "suspended",
  5: "service recommended", 6: "service required", 7: "recoverable error", 8: "fatal error" };
async function pollStatus() {
  try {
    const s = await (await fetch("/status", { cache: "no-store" })).json();
    const d = s.device || {};
    if (!mountChosen && typeof d.UpsideDown === "boolean" && (d.UpsideDown ? "upsidedown" : "upright") !== ui.mount) {
      ui.mount = d.UpsideDown ? "upsidedown" : "upright"; $("mount").value = ui.mount;
      buildGuides(Math.min(ui.maxRange, 200)); rebuild();
    }
    if (d.DeviceType) { $("title").textContent = d.DeviceType; $("subtitle").textContent = `SN ${d.SerialNumber} · FW ${d.FirmwareVersion}`; }
    const code = d.CommonDeviceStatus && d.CommonDeviceStatus.Status;
    $("devStatus").textContent = STATUS[code] ?? "–";
    $("devDot").className = "dot " + (code === 3 ? "ok" : code >= 7 ? "err" : code != null ? "warn" : "");
    const num = (v, digits, unit) => typeof v === "number" ? v.toFixed(digits) + unit : "–";
    $("temps").textContent = `${num(d.KM_SysBoard_Temp, 1, " °C")} / ${num(d.KM_APDBoard_Temp, 1, " °C")}`;
    $("volt").textContent = num(d.KM_PowerSource_Voltage, 2, " V");
    $("mirror").textContent = typeof d.KM_MotorRotationPeriod === "number" ? (1000 / d.KM_MotorRotationPeriod).toFixed(2) + " Hz" : "–";
    $("window").textContent = d.KMWindowError ? "error" : d.KMWindowWarning ? "warning" : d.KMWindowError === false ? "clean" : "–";
    if (s.error) $("err").textContent = s.error;
  } catch (e) { /* frame poll reports connectivity */ }
  setTimeout(pollStatus, 2000);
}

// ---------- render loop ----------
let frames = 0, fpsT = performance.now();
function animate(t) {
  requestAnimationFrame(animate);
  // render on demand: only when something changed (new scan, settings, resize) or the camera moves
  // (controls.update() is true while dragging and during the damping glide) — at 10 Hz scans and a
  // still camera that is 10 renders/s instead of the display refresh rate
  if (ui.mode === "3d") {
    const moved = controls.update();
    if (moved || needsRender) { renderer.render(scene, camera); frames++; needsRender = false; }
  }
  if (t - fpsT > 1000) { $("fps").textContent = Math.round(frames * 1000 / (t - fpsT)); frames = 0; fpsT = t; }
  const age = performance.now() - lastFrameAt;
  $("streamDot").className = "dot " + (ui.paused ? "warn" : lastFrameAt && age < 500 ? "ok" : "err");
}

buildGuides(ui.maxRange);
setView("persp");
requestAnimationFrame(animate);
pollFrames();
pollStatus();
</script>
</body>
</html>
