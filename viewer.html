<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRS6000 Live View</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22e6; --border: #2a313c; --text: #d7dde5; --muted: #8b95a3;
    --accent: #4aa3ff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #view2d { position: fixed; inset: 0; width: 100%; height: 100%; background: var(--bg); cursor: crosshair; }
  #tip { position: fixed; pointer-events: none; background: #161b22f0; border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; line-height: 1.5; white-space: pre; font-variant-numeric: tabular-nums; }
  #panel { position: fixed; top: 12px; left: 12px; width: 280px; max-height: calc(100% - 24px);
    overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; backdrop-filter: blur(6px); }
  h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 14px 0 6px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 5px 0; }
  .row span:last-child { font-variant-numeric: tabular-nums; }
  label { color: var(--muted); }
  select, input[type=range] { width: 150px; }
  select { background: #0d1117; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: #21262d; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
  #legendBox.hidden { display: none; }
  #legend { height: 10px; border-radius: 3px; margin-top: 6px; }
  .legend-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  #hint { position: fixed; bottom: 10px; right: 14px; color: var(--muted); font-size: 11px; }
  #err { color: var(--err); font-size: 12px; margin-top: 8px; }
  details.stage { border: 1px solid var(--border); border-radius: 8px; margin: 6px 0; padding: 0 8px; }
  details.stage[open] { padding-bottom: 6px; }
  details.stage summary { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; list-style: none; }
  details.stage summary::-webkit-details-marker { display: none; }
  details.stage summary::before { content: "▸"; color: var(--muted); width: 10px; }
  details.stage[open] summary::before { content: "▾"; }
  details.stage summary .name { flex: 1; }
  details.stage.off summary .name { color: var(--muted); }
  details.stage .note { color: var(--muted); font-size: 11px; margin: 0 0 4px; }
  .param { margin: 6px 0; }
  .param .top { display: flex; justify-content: space-between; font-size: 12px; }
  .param .top span:last-child { font-variant-numeric: tabular-nums; }
  .param input[type=range] { width: 100%; }
  details.stage.off .param { opacity: .45; }
  @media (max-width: 600px) { #panel { width: calc(100% - 24px); max-height: 45%; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<canvas id="view2d" hidden></canvas>
<div id="tip" hidden></div>
<div id="panel">
  <h1 id="title">MRS6000</h1>
  <div class="sub" id="subtitle">connecting…</div>

  <h2>Stream</h2>
  <div class="row"><span><span class="dot" id="streamDot"></span>Scan rate</span><span id="rate">–</span></div>
  <div class="row"><span>Points / scan</span><span id="points">–</span></div>
  <div class="row"><span>Layers × beams</span><span id="geom">–</span></div>
  <div class="row"><span>Processing</span><span id="proc">–</span></div>
  <div class="row"><span title="3D renders per second: on demand, so ≈ scan rate with a still camera">Renders / s</span><span id="fps">–</span></div>

  <h2>Device</h2>
  <div class="row"><span><span class="dot" id="devDot"></span>Status</span><span id="devStatus">–</span></div>
  <div class="row"><span>System / APD temp</span><span id="temps">–</span></div>
  <div class="row"><span>Supply</span><span id="volt">–</span></div>
  <div class="row"><span>Mirror</span><span id="mirror">–</span></div>
  <div class="row"><span>Window</span><span id="window">–</span></div>

  <h2>Surface</h2>
  <div class="row"><label for="draw">Draw</label>
    <select id="draw">
      <option value="surface">surface</option>
      <option value="surface+points">surface + points</option>
      <option value="points">points</option>
      <option value="lines">layer lines</option>
      <option value="points+lines">points + lines</option>
    </select></div>
  <div class="row"><label for="mode">Mode</label>
    <select id="mode"><option value="auto">auto (recommended)</option><option value="manual">manual</option></select></div>
  <div id="autoInfo" class="note" style="color:var(--muted);font-size:11px;margin:2px 0 6px"></div>
  <div class="row"><label for="preset">Smoothing preset</label>
    <select id="preset">
      <option value="off">off</option><option value="light">light</option>
      <option value="medium">medium</option><option value="strong">strong</option>
      <option value="custom" disabled>custom</option>
    </select></div>
  <div id="stages"></div>
  <div class="btns" style="margin-top:8px"><button id="resetCfg">Reset to defaults</button></div>
  <div class="row"><span>Removed</span><span id="removed" style="font-size:12px">–</span></div>
  <div class="row"><span>Triangles</span><span id="tris">–</span></div>

  <h2>Display</h2>
  <div class="row"><label for="colorBy">Color by</label>
    <select id="colorBy">
      <option value="uniform">uniform (shaded)</option>
      <option value="rssi">RSSI (intensity)</option>
      <option value="dist">Distance</option>
      <option value="height">Height</option>
      <option value="layer">Layer</option>
      <option value="noise">Noise σ (history)</option>
      <option value="conf">Confidence (history)</option>
      <option value="area">Area class (adaptive)</option>
    </select></div>
  <div id="legendBox" class="hidden">
    <div id="legend"></div>
    <div class="legend-labels"><span id="legMin">–</span><span id="legMax">–</span></div>
  </div>
  <div class="row"><label for="layerSel">Layer</label><select id="layerSel"><option value="-1">all</option></select></div>
  <div class="row"><label for="size">Point size</label><input id="size" type="range" min="0.5" max="6" step="0.5" value="1"></div>
  <div class="row"><label for="range">Max range <span id="rangeVal"></span></label><input id="range" type="range" min="2" max="200" step="1" value="60"></div>
  <div class="row"><label for="mount" title="Upright: sensor standing normally (negative elevation = down). Upside down: rotated 180° about the forward axis (up/down and left/right swap).">Mounting</label>
    <select id="mount"><option value="upright">upright</option><option value="upsidedown">upside down</option></select></div>

  <h2>View</h2>
  <div class="btns" id="modeBtns">
    <button data-mode="3d" class="on">3D</button><button data-mode="top">2D map</button><button data-mode="image">Range image</button>
  </div>
  <div class="btns" id="cam3d" style="margin-top:6px">
    <button id="vPersp">Perspective</button><button id="vTop">Top</button><button id="vSide">Side</button><button id="vFront">Front</button>
  </div>
  <div class="btns" style="margin-top:6px"><button id="fit2d" hidden>Fit view</button><button id="pause">Pause</button></div>
  <div id="err"></div>
</div>
<div id="hint">drag: rotate · right-drag: pan · wheel: zoom · space: pause</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------- scene ----------
const container = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x0e1116);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
let needsRender = true;                     // 3D view is drawn on demand (see animate)
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 2000);
camera.up.set(0, 0, 1);                     // sensor frame: x forward, y left, z up
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// lighting for the surface: soft sky/ground fill + a headlight that follows the camera
scene.add(new THREE.HemisphereLight(0xdde6f0, 0x2a2f38, 0.9));
const headlight = new THREE.DirectionalLight(0xffffff, 1.6);
camera.add(headlight); headlight.position.set(0.3, 0.5, 1);
scene.add(camera);

function resize() {
  needsRender = true;
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize); resize();

// range rings every 5 m (labels every 10 m) + FOV wedge
const guides = new THREE.Group(); scene.add(guides);
let fanElev = [-13.19, 1.19];               // lowest / highest layer elevation (updated from the data)
function buildGuides(maxR) {
  guides.clear();
  const ringMat = new THREE.LineBasicMaterial({ color: 0x2a313c });
  const ring10 = new THREE.LineBasicMaterial({ color: 0x3d4654 });
  const step = maxR > 60 ? 10 : 5;
  for (let r = step; r <= maxR; r += step) {
    const pts = [];
    for (let a = -180; a <= 180; a += 2) pts.push(new THREE.Vector3(r * Math.cos(a * Math.PI / 180), r * Math.sin(a * Math.PI / 180), 0));
    guides.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), r % (step * 2) === 0 ? ring10 : ringMat));
  }
  const fov = new THREE.LineBasicMaterial({ color: 0x4aa3ff, transparent: true, opacity: 0.35 });
  for (const a of [-60, 60]) {
    const rad = a * Math.PI / 180;
    guides.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(0, 0, 0), new THREE.Vector3(maxR * Math.cos(rad), maxR * Math.sin(rad), 0)]), fov));
  }
  // vertical field of view: the sensor only sees a fan from the lowest to the highest layer angle,
  // so a wall running away from the sensor is covered by a wedge that grows with distance
  const sgn = ui.mount === "upsidedown" ? -1 : 1, fanMat = new THREE.LineBasicMaterial({ color: 0xd29922, transparent: true, opacity: 0.6 });
  for (const e of fanElev) {
    const r = maxR, el = e * Math.PI / 180;
    guides.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(0, 0, 0), new THREE.Vector3(r * Math.cos(el), 0, sgn * r * Math.sin(el))]), fanMat));
  }
  guides.add(new THREE.AxesHelper(1));       // red x (forward), green y (left), blue z (up)
}

// sensor marker
const sensor = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.12), new THREE.MeshBasicMaterial({ color: 0xffd33d }));
scene.add(sensor);

// turbo colormap (Google, polynomial approximation)
function turbo(t) {
  t = Math.min(1, Math.max(0, t));
  const r = 0.13572138 + t * (4.61539260 + t * (-42.66032258 + t * (132.13108234 + t * (-152.94239396 + t * 59.28637943))));
  const g = 0.09140261 + t * (2.19418839 + t * (4.84296658 + t * (-14.18503333 + t * (4.27729857 + t * 2.82956604))));
  const b = 0.10667330 + t * (12.64194608 + t * (-60.58204836 + t * (110.36276771 + t * (-89.90310912 + t * 27.34824973))));
  return [Math.min(1, Math.max(0, r)), Math.min(1, Math.max(0, g)), Math.min(1, Math.max(0, b))];
}
document.getElementById("legend").style.background = "linear-gradient(90deg," +
  Array.from({ length: 11 }, (_, i) => { const [r, g, b] = turbo(i / 10); return `rgb(${r * 255 | 0},${g * 255 | 0},${b * 255 | 0})`; }).join(",") + ")";

// ---------- UI state ----------
const $ = id => document.getElementById(id);
const ui = { colorBy: "uniform", layer: -1, maxRange: 60, mount: "upright", paused: false, draw: "surface" };
let mountChosen = false;                    // until the user picks one, follow the device's UpsideDown parameter
try { const m = localStorage.getItem("mrs6000.mount.v2"); if (m === "upright" || m === "upsidedown") { ui.mount = m; mountChosen = true; } } catch (e) {}

const DEG = Math.PI / 180;

// ---------- smoothing configuration (schema → generated controls) ----------
// Every tunable of the processing pipeline. `pct` params are shown as % per metre of range.
const STAGES = [
  { key: "intensity", title: "Intensity filter", toggle: true, extra: "histogram", preset: false,
    help: "Drops returns whose RSSI lies outside the range, before any smoothing (weak returns are often noise; very strong ones are reflectors).",
    params: [
      { k: "min", label: "Min. RSSI", min: 0, max: 400, step: 1 },
      { k: "max", label: "Max. RSSI", min: 0, max: 400, step: 1 } ] },
  { key: "layercal", title: "Layer calibration", toggle: true, extra: "layerbias", preset: false,
    help: "Each of the 24 layers has its own constant distance offset (up to a few cm), which shows up as horizontal " +
          "waves on flat walls. The offsets are learned live: each layer's median deviation from planes fitted through " +
          "its neighbouring layers. Mean, bottom-to-top trend and slow bow are pinned to zero (unmeasurable " +
          "from plane fits, they would otherwise drift into tilted or bulging walls), so scale and verticality are untouched.",
    params: [
      { k: "rate", label: "Learning rate", min: 0, max: 1, step: 0.05, fmt: v => v ? Math.round(v * 100) + " % per update" : "frozen" } ] },
  { key: "adaptive", title: "Adaptive per area", toggle: true, preset: false,
    help: "Detects moving areas (clusters of beams whose new value breaks their own history) and processes them " +
          "lightly: no long averaging or confirmation delay, no flicker removal, little spatial smoothing, no plane " +
          "flattening. Static areas keep the full settings below. Colour by 'Area class' to see the result.",
    params: [
      { k: "minCluster", label: "Min. moving cluster", min: 1, max: 60, step: 1, unit: " beams" },
      { k: "growBeams", label: "Grow into object", min: 0, max: 30, step: 1, unit: " steps" },
      { k: "hold", label: "Stay 'moving' after last change", min: 1, max: 50, step: 1, fmt: v => `${v} scans (${(v / 10).toFixed(1)} s)` },
      { k: "dynWindow", label: "Averaging in moving areas", min: 1, max: 5, step: 1, unit: " scans" },
      { k: "dynSpatial", label: "Spatial window in moving areas", min: 0, max: 6, step: 1, unit: " beams" } ] },
  { key: "outlier", title: "Outlier filter", toggle: true, note: "Applies to new scans.",
    help: "Drops returns without enough neighbours at a similar distance in the same layer.",
    params: [
      { k: "win", label: "Neighbour window", min: 1, max: 8, step: 1, unit: " beams" },
      { k: "need", label: "Required neighbours", min: 1, max: 6, step: 1 },
      { k: "abs", label: "Distance tolerance", min: 0.02, max: 0.5, step: 0.01, unit: " m" },
      { k: "rel", label: "Tolerance growth", min: 0, max: 0.1, step: 0.005, pct: true } ] },
  { key: "temporal", title: "Temporal smoothing", toggle: true, note: "Applies to new scans.",
    help: "Each beam averages its own history (Kalman-style): the window grows while the beam is still, " +
          "its noise σ is learned, a change beyond k·σ must be confirmed by following scans before the beam " +
          "switches (single spikes are ignored, real motion is followed).",
    params: [
      { k: "window", label: "Max. averaging window", min: 1, max: 60, step: 1, unit: " scans" },
      { k: "k", label: "Change gate", min: 1.5, max: 8, step: 0.5, fmt: v => v.toFixed(1) + " σ" },
      { k: "minGate", label: "Min. gate", min: 0.03, max: 0.5, step: 0.01, unit: " m" },
      { k: "confirm", label: "Confirm change after", min: 1, max: 5, step: 1, unit: " scans" },
      { k: "noiseFloor", label: "Noise floor σ", min: 0.005, max: 0.1, step: 0.001, fmt: v => Math.round(v * 1000) + " mm" },
      { k: "hold", label: "Hold through dropouts", min: 0, max: 10, step: 1, unit: " scans" } ] },
  { key: "history", title: "History filter", toggle: true,
    help: "Uses each beam's last 32 scans: drops beams that flicker (rarely valid or often jumping — mixed pixels " +
          "at edges, dust, reflections) and lets stable beams count more in spatial smoothing and plane fits.",
    params: [
      { k: "minValid", label: "Min. valid in history", min: 0, max: 1, step: 0.05, fmt: v => Math.round(v * 100) + " %" },
      { k: "maxJump", label: "Max. jump rate", min: 0.05, max: 1, step: 0.05, fmt: v => Math.round(v * 100) + " %" },
      { k: "weight", label: "Confidence weighting", min: 0, max: 3, step: 0.25, fmt: v => v ? "×" + v.toFixed(2) : "off" } ] },
  { key: "spatial", title: "Spatial smoothing", toggle: true,
    help: "Edge-preserving bilateral filter on the range image.",
    params: [
      { k: "wb", label: "Window along layer", min: 1, max: 12, step: 1, unit: " beams" },
      { k: "wl", label: "Window across layers", min: 0, max: 2, step: 1, unit: " layers" },
      { k: "srAbs", label: "Edge sensitivity σ", min: 0.01, max: 0.3, step: 0.005, unit: " m" },
      { k: "srRel", label: "σ growth", min: 0, max: 0.05, step: 0.001, pct: true },
      { k: "srNoise", label: "σ from beam noise", min: 0, max: 5, step: 0.5, fmt: v => v ? `≥ ${v}× beam σ` : "off" } ] },
  { key: "planes", title: "Flatten planes", toggle: true,
    help: "Fits a plane around each point (PCA) and moves the point along its beam onto it.",
    params: [
      { k: "wb", label: "Window along layer", min: 1, max: 12, step: 1, unit: " beams" },
      { k: "wl", label: "Window across layers", min: 0, max: 2, step: 1, unit: " layers" },
      { k: "planarity", label: "Max. curvature", min: 0.002, max: 0.2, step: 0.002, fmt: v => v.toFixed(3) },
      { k: "minPts", label: "Min. points in fit", min: 4, max: 40, step: 1 },
      { k: "minCos", label: "Min. incidence", min: 0, max: 0.6, step: 0.01, fmt: v => Math.round(Math.asin(v) / DEG) + "° to surface" },
      { k: "tolAbs", label: "Same-surface tolerance", min: 0.05, max: 0.5, step: 0.01, unit: " m" },
      { k: "tolRel", label: "Tolerance growth", min: 0, max: 0.1, step: 0.005, pct: true },
      { k: "noiseFlat", label: "Flat test", min: 0, max: 5, step: 0.25, fmt: v => v ? `residual ≤ ${v}× noise floor` : "curvature only" } ] },
  { key: "mesh", title: "Mesh / lines", toggle: false,
    help: "Neighbours further apart in distance than this are not connected (object edges).",
    params: [
      { k: "jump", label: "Break at jump", min: 0.05, max: 3, step: 0.05, unit: " m" },
      { k: "jumpRel", label: "Jump growth", min: 0, max: 0.1, step: 0.005, pct: true } ] },
];
const PRESET_KEYS = STAGES.filter(s => s.preset !== false).map(s => s.key);

const PRESETS = {
  medium: {
    outlier: { on: true, win: 2, need: 1, abs: 0.15, rel: 0.03 },
    temporal: { on: true, window: 10, k: 3, minGate: 0.1, confirm: 2, noiseFloor: 0.02, hold: 2 },
    history: { on: true, minValid: 0.5, maxJump: 0.4, weight: 1 },
    spatial: { on: true, wb: 3, wl: 0, srAbs: 0.05, srRel: 0.01, srNoise: 0 },
    planes: { on: true, wb: 4, wl: 1, planarity: 0.02, minPts: 8, minCos: 0.15, tolAbs: 0.2, tolRel: 0.03, noiseFlat: 0 },
    mesh: { jump: 0.5, jumpRel: 0.02 },
  },
};
PRESETS.off = structuredClone(PRESETS.medium);
for (const k of ["outlier", "temporal", "history", "spatial", "planes"]) PRESETS.off[k].on = false;
PRESETS.light = structuredClone(PRESETS.medium);
Object.assign(PRESETS.light.temporal, { window: 4, confirm: 1 });
Object.assign(PRESETS.light.history, { minValid: 0.3, maxJump: 0.6, weight: 0.5 });
Object.assign(PRESETS.light.spatial, { wb: 2 });
Object.assign(PRESETS.light.planes, { wb: 3, planarity: 0.01 });
PRESETS.strong = structuredClone(PRESETS.medium);
Object.assign(PRESETS.strong.outlier, { win: 3, need: 2, abs: 0.1, rel: 0.02 });
Object.assign(PRESETS.strong.temporal, { window: 30, confirm: 3 });
Object.assign(PRESETS.strong.history, { minValid: 0.7, maxJump: 0.25, weight: 2 });
Object.assign(PRESETS.strong.spatial, { wb: 6, wl: 1 });
Object.assign(PRESETS.strong.planes, { wb: 7, planarity: 0.06 });
const DEFAULT_INTENSITY = { on: false, min: 0, max: 400 };
const DEFAULT_LAYERCAL = { on: true, rate: 0.3 };
const DEFAULT_ADAPTIVE = { on: true, minCluster: 8, growBeams: 12, hold: 10, dynWindow: 1, dynSpatial: 1 };   // tuned on a recorded walk

const STORE_KEY = "mrs6000.smoothing.v3";
// manual settings are kept separately, so switching auto → manual → auto never loses them
let manualCfg = { ...structuredClone(PRESETS.medium), intensity: { ...DEFAULT_INTENSITY }, layercal: { ...DEFAULT_LAYERCAL }, adaptive: { ...DEFAULT_ADAPTIVE } };
let mode = "auto";
try {                                         // remembered per browser; any problem → defaults
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved) {
    if (saved.mode === "manual" || saved.mode === "auto") mode = saved.mode;
    for (const s of STAGES) Object.assign(manualCfg[s.key], (saved.manual || {})[s.key] || {});
  }
} catch (e) { /* storage unavailable */ }

// ---------- auto mode: settings derived from measured scene statistics ----------
// Rules from the literature (sources in the README of this viewer's discussion):
//  • z-gate of 3 σ per beam (beam-wise statistical background subtraction for static LiDAR),
//  • tolerances scale with the measured noise floor and with range·tan(beam step) (range-adaptive radius),
//  • bilateral range σ follows each beam's own noise (noise-adaptive bilateral filtering),
//  • "flat" = plane residual within ~2 σ of the noise floor,
//  • motion: established model (≥5 scans), cluster filter, seeds grown into the object, short persistence
//    (Dynablox); cluster 8 / grow 12 / hold 1 s were then tuned on a recorded walk (moving beams wrong
//    or missing 73 % → 3 %, static surfaces unchanged), immediate following + light filtering when moving.
let autoNoise = 0.02, autoStats = "", autoFrame = 0;
function autoCfg(base) {
  const nf = autoNoise, rel = 4 * Math.tan(0.13 * Math.PI / 180);      // ≈ 1 % of range per beam step
  return {
    ...structuredClone(base),
    outlier: { on: true, win: 2, need: 1, abs: Math.max(0.1, 5 * nf), rel: +rel.toFixed(3) },
    temporal: { on: true, window: 20, k: 3, minGate: Math.max(0.06, 2.5 * nf), confirm: 2, noiseFloor: nf, hold: 2 },
    history: { on: true, minValid: 0.5, maxJump: 0.3, weight: 1 },
    spatial: { on: true, wb: 3, wl: 0, srAbs: 1.5 * nf, srRel: 0.005, srNoise: 2 },
    planes: { on: true, wb: 5, wl: 1, planarity: 0.02, minPts: 12, minCos: 0.2, tolAbs: Math.max(0.1, 5 * nf), tolRel: 0.02, noiseFlat: 2 },
    mesh: { jump: 0.3, jumpRel: 0.03 },
    adaptive: { on: true, minCluster: 8, growBeams: 12, hold: 10, dynWindow: 1, dynSpatial: 1 },   // tuned on a recorded walk
    layercal: { on: true, rate: 0.3 },
    intensity: base.intensity,                                            // content choice: stays yours
  };
}
// noise floor = median σ of steady, established, static beams (quantised to 1 mm so settings don't jitter)
function autoTune() {
  if (mode !== "auto") return;
  if (G && G.frames >= 10) {
    const s = [];
    for (let i = 0; i < G.N; i += 3)
      if (G.nAvg[i] >= 5 && G.jumpRate[i] < 0.1 && G.motionHold[i] === 0 && G.temporal[i] > 0) s.push(Math.sqrt(G.noiseVar[i]));
    if (s.length > 200) {
      s.sort((a, b) => a - b);
      autoNoise = Math.min(0.08, Math.max(0.012, Math.round(s[s.length >> 1] * 1000) / 1000));
      let moving = 0; for (let i = 0; i < G.N; i++) if (G.motionHold[i] > 0) moving++;
      autoStats = `noise floor ${Math.round(autoNoise * 1000)} mm (median of ${s.length} steady beams) · ` +
        `gate 3σ · ${(100 * moving / G.N).toFixed(1)} % moving`;
    }
  }
  cfg = autoCfg(manualCfg);
}
let cfg = mode === "auto" ? autoCfg(manualCfg) : structuredClone(manualCfg);

const fmtParam = (p, v) => p.fmt ? p.fmt(v) : p.pct ? `+${(v * 100).toFixed(1)} % of range`
  : (Number.isInteger(p.step) ? v : v.toFixed(p.step < 0.01 ? 3 : 2)) + (p.unit || "");

function buildStageControls() {
  const host = $("stages");
  host.innerHTML = "";
  for (const s of STAGES) {
    const det = document.createElement("details");
    det.className = "stage";
    det.dataset.key = s.key;
    const sum = document.createElement("summary");
    sum.title = s.help;
    if (s.toggle) {
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.id = `cfg-${s.key}-on`;
      cb.addEventListener("click", e => e.stopPropagation());   // don't fold the section
      cb.addEventListener("change", () => { cfg[s.key].on = cb.checked; changed(); });
      sum.append(cb);
    }
    const name = document.createElement("span");
    name.className = "name"; name.textContent = s.title;
    sum.append(name);
    det.append(sum);
    const note = document.createElement("div");
    note.className = "note"; note.textContent = s.help + (s.note ? " " + s.note : "");
    det.append(note);
    if (s.extra === "histogram") {
      const cv = document.createElement("canvas");
      cv.id = "rssiHist"; cv.width = 480; cv.height = 90;
      cv.style.cssText = "width:100%;height:45px;display:block;margin:4px 0;border-radius:4px;background:#0d1117";
      det.append(cv);
      det.addEventListener("toggle", drawHistogram);
    }
    if (s.extra === "layerbias") {
      const cv = document.createElement("canvas");
      cv.id = "layerBiasChart"; cv.width = 480; cv.height = 120;
      cv.style.cssText = "width:100%;height:60px;display:block;margin:4px 0;border-radius:4px;background:#0d1117";
      const btn = document.createElement("button");
      btn.textContent = "Reset calibration"; btn.style.marginTop = "4px";
      btn.onclick = () => { layerBias.fill(0); saveLayerBias(); resetHistory(); drawLayerBias(); };
      det.append(cv, btn);
      det.addEventListener("toggle", drawLayerBias);
    }
    for (const p of s.params) {
      const wrap = document.createElement("div");
      wrap.className = "param";
      const top = document.createElement("div");
      top.className = "top";
      const lab = document.createElement("label"), val = document.createElement("span");
      lab.htmlFor = `cfg-${s.key}-${p.k}`; lab.textContent = p.label; val.id = `cfg-${s.key}-${p.k}-val`;
      top.append(lab, val);
      const inp = document.createElement("input");
      Object.assign(inp, { type: "range", id: `cfg-${s.key}-${p.k}`, min: p.min, max: p.max, step: p.step });
      inp.addEventListener("input", () => {
        cfg[s.key][p.k] = +inp.value;
        if (s.key === "intensity") {                 // keep min ≤ max
          if (p.k === "min" && cfg.intensity.max < cfg.intensity.min) cfg.intensity.max = cfg.intensity.min;
          if (p.k === "max" && cfg.intensity.min > cfg.intensity.max) cfg.intensity.min = cfg.intensity.max;
        }
        changed();
      });
      wrap.append(top, inp);
      det.append(wrap);
    }
    host.append(det);
  }
}

function syncControls() {
  for (const s of STAGES) {
    if (s.toggle) $(`cfg-${s.key}-on`).checked = cfg[s.key].on;
    document.querySelector(`details.stage[data-key="${s.key}"]`).classList.toggle("off", s.toggle && !cfg[s.key].on);
    for (const p of s.params) {
      $(`cfg-${s.key}-${p.k}`).value = cfg[s.key][p.k];
      $(`cfg-${s.key}-${p.k}-val`).textContent = fmtParam(p, cfg[s.key][p.k]);
    }
  }
  const pick = c => JSON.stringify(PRESET_KEYS.map(k => c[k]));
  const match = Object.keys(PRESETS).find(n => pick(PRESETS[n]) === pick(cfg));
  $("preset").value = match || "custom";
  // auto: every stage except the intensity filter is chosen automatically and shown read-only
  const auto = mode === "auto";
  $("mode").value = mode;
  $("preset").disabled = auto; $("resetCfg").hidden = auto;
  for (const s of STAGES) {
    const locked = auto && s.key !== "intensity";
    document.querySelectorAll(`details.stage[data-key="${s.key}"] input`).forEach(el => { el.disabled = locked; });
  }
  $("autoInfo").textContent = auto ? "Auto: " + (autoStats || "learning the scene…") +
    ". Settings below are chosen from the measured noise and motion and update every second; switch to manual to edit." : "";
  drawHistogram();
}

let saveTimer = 0;
function changed() {
  syncControls();
  clearTimeout(saveTimer);
  if (mode === "manual") manualCfg = structuredClone(cfg);
  else manualCfg.intensity = structuredClone(cfg.intensity);       // intensity stays user-controlled in auto
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify({ mode, manual: manualCfg })); } catch (e) {} }, 300);
  rebuild();
}
function applyPreset(name) {
  cfg = { ...structuredClone(PRESETS[name]), intensity: cfg.intensity, layercal: cfg.layercal, adaptive: cfg.adaptive };   // presets leave filters/calibration/adaptivity alone
  resetHistory();                                                          // start averaging afresh
  changed();
}

// RSSI histogram of the latest scan with the kept range highlighted
let rssiHist = null;
function drawHistogram() {
  const cv = $("rssiHist");
  if (!cv || !rssiHist || !cv.closest("details").open) return;
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, n = rssiHist.length;
  const peak = Math.max(1, ...rssiHist);
  ctx.clearRect(0, 0, W, H);
  const lo = cfg.intensity.min, hi = cfg.intensity.max, on = cfg.intensity.on;
  for (let i = 0; i < n; i++) {
    const v = i * 400 / n, kept = !on || (v >= lo && v <= hi);
    const h = Math.max(rssiHist[i] ? 2 : 0, Math.sqrt(rssiHist[i] / peak) * (H - 4));   // sqrt: small bins stay visible
    ctx.fillStyle = kept ? "#4aa3ff" : "#3a4250";
    ctx.fillRect(i * W / n, H - h, W / n - 1, h);
  }
}

buildStageControls();
syncControls();
$("preset").addEventListener("change", e => applyPreset(e.target.value));
$("mode").addEventListener("change", e => {
  mode = e.target.value;
  if (mode === "auto") autoTune(); else cfg = structuredClone(manualCfg);
  changed();
});
$("resetCfg").onclick = () => { cfg.intensity = { ...DEFAULT_INTENSITY }; cfg.layercal = { ...DEFAULT_LAYERCAL }; cfg.adaptive = { ...DEFAULT_ADAPTIVE }; applyPreset("medium"); };
